# Wolfi Python 3.14 runtime base — DEV variant: python-3.14 + busybox, for
# `kubectl exec ... -- sh` debugging. NOT for production app images.
# Also published as the `python-dev` alias.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - python-3.14

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /usr/bin/python3.14

archs:
  - x86_64
  - aarch64
